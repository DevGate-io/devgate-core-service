databaseChangeLog:
  - changeSet:
      id: 1785076941817-1
      author: progger
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            tableName: secrets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_secrets
              - column:
                  name: service_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: environment
                  type: VARCHAR(32)
              - column:
                  name: description
                  type: VARCHAR(1024)
              - column:
                  name: last_rotated_at
                  type: DATETIME
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: secrets
            baseColumnNames: service_id
            constraintName: fk_secrets_service
            referencedTableName: services
            referencedColumnNames: id
        - createIndex:
            indexName: idx_secrets_service_id
            tableName: secrets
            columns:
              - column:
                  name: service_id
