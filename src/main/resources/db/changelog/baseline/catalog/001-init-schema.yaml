databaseChangeLog:
  - changeSet:
      id: 1784637128456-1
      author: progger
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_projects
              - column:
                  name: team_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_projects_team_id
            tableName: projects
            columns:
              - column:
                  name: team_id
        - createTable:
            tableName: services
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_services
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: owner_team_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: VARCHAR(255)
              - column:
                  name: repo_url
                  type: VARCHAR(512)
              - column:
                  name: pipeline_url
                  type: VARCHAR(512)
              - column:
                  name: docs_url
                  type: VARCHAR(512)
              - column:
                  name: health
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slo_availability
                  type: DOUBLE
              - column:
                  name: slo_latency_p95_ms
                  type: INT
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: services
            baseColumnNames: project_id
            constraintName: fk_services_project
            referencedTableName: projects
            referencedColumnNames: id
        - createIndex:
            indexName: idx_services_project_id
            tableName: services
            columns:
              - column:
                  name: project_id
        - createIndex:
            indexName: idx_services_owner_team_id
            tableName: services
            columns:
              - column:
                  name: owner_team_id
        - createTable:
            tableName: service_tags
            columns:
              - column:
                  name: service_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: tag
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: service_tags
            baseColumnNames: service_id
            constraintName: fk_service_tags_service
            referencedTableName: services
            referencedColumnNames: id
        - createTable:
            tableName: service_dependencies
            columns:
              - column:
                  name: service_id
                  type: UUID
                  constraints:
                    nullable: false
              # Intentionally no FK to services.id here — the dependency graph is Phase 6+,
              # this column just stores a raw service id string for now (see ServiceType.dependencies).
              - column:
                  name: dependency_service_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: service_dependencies
            baseColumnNames: service_id
            constraintName: fk_service_dependencies_service
            referencedTableName: services
            referencedColumnNames: id
        - createTable:
            tableName: service_environments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_service_environments
              - column:
                  name: service_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(512)
        - addForeignKeyConstraint:
            baseTableName: service_environments
            baseColumnNames: service_id
            constraintName: fk_service_environments_service
            referencedTableName: services
            referencedColumnNames: id
